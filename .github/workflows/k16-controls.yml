name: K16 parallel bottle scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Width pair ${{ matrix.w1 }}×${{ matrix.w2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { w1: 15, w2: 15 }
          - { w1: 15, w2: 16 }
          - { w1: 15, w2: 17 }
          - { w1: 15, w2: 18 }
          - { w1: 15, w2: 19 }
          - { w1: 15, w2: 20 }
          - { w1: 16, w2: 15 }
          - { w1: 16, w2: 16 }
          - { w1: 16, w2: 17 }
          - { w1: 16, w2: 18 }
          - { w1: 16, w2: 19 }
          - { w1: 16, w2: 20 }
          - { w1: 17, w2: 15 }
          - { w1: 17, w2: 16 }
          - { w1: 17, w2: 17 }
          - { w1: 17, w2: 18 }
          - { w1: 17, w2: 19 }
          - { w1: 17, w2: 20 }
          - { w1: 18, w2: 15 }
          - { w1: 18, w2: 16 }
          - { w1: 18, w2: 17 }
          - { w1: 18, w2: 18 }
          - { w1: 18, w2: 19 }
          - { w1: 18, w2: 20 }
          - { w1: 19, w2: 15 }
          - { w1: 19, w2: 16 }
          - { w1: 19, w2: 17 }
          - { w1: 19, w2: 18 }
          - { w1: 19, w2: 19 }
          - { w1: 19, w2: 20 }
          - { w1: 20, w2: 15 }
          - { w1: 20, w2: 16 }
          - { w1: 20, w2: 17 }
          - { w1: 20, w2: 18 }
          - { w1: 20, w2: 19 }
          - { w1: 20, w2: 20 }
    env:
      OMP_NUM_THREADS: 2
      OMP_DYNAMIC: FALSE
      K14_T2A: 0.02
      K14_T2B: 0.001
    steps:
      - name: Check out K16 project
        uses: actions/checkout@v4

      - name: Compile solver
        run: gcc -std=c11 -O3 -march=native -flto -fopenmp -o k16 tools/k16_double_ct2.c -lm

      - name: Search this pair on the real 979-letter ciphertext
        env:
          W1: ${{ matrix.w1 }}
          W2: ${{ matrix.w2 }}
          RUN_SEED: ${{ github.run_number }}
        run: |
          mkdir -p results
          set -o pipefail
          ./k16 solvepair data/models/qg_de.bin data/ciphertext_979.txt \
            "$W1" "$W2" 12 200000 5 20000 "$((RUN_SEED * 100 + W1 * 10 + W2))" \
            | tee "results/pair-$W1-$W2.log"

      - name: Preserve candidate and keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k16-pair-${{ matrix.w1 }}-${{ matrix.w2 }}
          path: results/pair-${{ matrix.w1 }}-${{ matrix.w2 }}.log
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Rank candidate plaintexts
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Download pair results
        uses: actions/download-artifact@v4
        with:
          pattern: k16-pair-*
          path: results
          merge-multiple: true

      - name: Rank candidate scores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          rows = []
          for p in Path("results").glob("pair-*.log"):
              text = p.read_text(errors="replace")
              m = re.search(r"PAIR w1=(\d+) w2=(\d+) score=([-\d.]+)", text)
              candidate = re.search(r"TEXT ([a-z]+)", text)
              if m:
                  rows.append((float(m.group(3)), int(m.group(1)), int(m.group(2)),
                               candidate.group(1) if candidate else ""))
          rows.sort(reverse=True)
          lines = ["# K16 candidate ranking", "",
                   f"Completed pairs: {len(rows)}/36. One standard search per pair; not a validated 10/10 decryption.", "",
                   "| Rank | Widths | German quadgram score | Candidate opening |",
                   "|---:|:---:|---:|---|"]
          for i, (score, w1, w2, candidate) in enumerate(rows[:12], 1):
              lines.append(f"| {i} | {w1}×{w2} | {score:.4f} | `{candidate[:48]}` |")
          lines.extend(["", "Full candidate texts and keys are in the per-pair artifacts.",
                        "A strong score is only a lead; inspect the complete text and test it against controls."])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
